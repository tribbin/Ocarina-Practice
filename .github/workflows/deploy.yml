# Pre-deploy gate: the practice acceptance suite must pass (headless
# Chromium, mic frames fed via the page's ?practiceTest=1 provider) before
# any deploy. Deploys to GitHub Pages run only for pushes on main.

name: test & deploy

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  practice-tests:
    name: practice accepts the play output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Run practice acceptance tests
        run: python tests/practice_accepts_melody.py

  deploy-pages:
    name: deploy to GitHub Pages
    needs: practice-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect site files (app only, no tests/venv)
        run: |
          mkdir -p _pages
          cp index.html _pages/
          cp -r css js _pages/
          cp *.json *.svg _pages/
          cp hyrule.jpg _pages/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - uses: actions/deploy-pages@v4
