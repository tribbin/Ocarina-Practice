# Practice battery: the console-hygiene scan, the full suite set
# (headless Chromium mic frames via the page's ?practiceTest=1 provider)
# and the lint pair run on every push/manual dispatch. Deployment itself stays with
# GitHub Pages' built-in branch deployment ("Deploy from a branch"): it
# ships on every push to main without this workflow, so these runs are a
# health check — NOT a deploy gate (flip the workflow to an Actions-based
# publish if a hard gate is ever wanted).

name: practice tests

on:
  # One run per commit: every push fires the battery once (Robin,
  # 2026-09-25 — drop the pull_request trigger instead of constraining
  # push, so branch work gets feedback whether or not a PR exists yet).
  # A PR whose base requires the check recognizes the head SHA's push run
  # by its job name; the merge-commit pre-validation is traded away —
  # main's own push-run post-merge is the shield.
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  practice-tests:
    name: the practice battery (suites + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint scripts (eslint flat config)
        run: npx --yes eslint@9 js/
      - name: Validate HTML structure
        run: npx --yes html-validate@8 index.html
      - name: Board structure verify (plans board)
        run: python tools/board.py verify
      - name: Run board tool tests (stdlib)
        run: python tests/board_tool.py
      - name: Run data-shape validator (instruments/songs/fingerings)
        run: python tests/data_validator.py
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Run console-hygiene boot error scan
        run: python tests/console_hygiene.py
      - name: Run practice acceptance tests
        run: python tests/practice_accepts_melody.py
      - name: Run separate-note dip gate tests
        run: python tests/practice_dip.py
      - name: Run practice seat (zen return) tests
        run: python tests/practice_zen_return.py
      - name: Run support-bracket tests
        run: python tests/support_accepts_brackets.py
      - name: Run parser edge-case tests
        run: python tests/parse_edges.py
      - name: Run render-behavior pin
        run: python tests/render_pin.py
      - name: Run shipped-songs acceptance
        run: python tests/shipped_songs.py
      - name: Run voice error visibility test
        run: python tests/voice_error_visibility.py
      - name: Run keyboard widget tests
        run: python tests/keyboard_widgets.py
      - name: Run reduced-motion gate tests
        run: python tests/reduced_motion.py
      - name: Run bad-chip style tests
        run: python tests/bad_chip_style.py
      - name: Run library hardening tests
        run: python tests/library_hardening.py
      - name: Run instrument switch race test
        run: python tests/instrument_switch_race.py
      - name: Run instrument layout tests
        run: python tests/instruments_load.py
      - name: Run svg re-render coordinates pin
        run: python tests/svg_cache.py
      - name: Run debug panel contract tests
        run: python tests/debug_panel.py
      - name: Run offline (service worker) tests
        run: python tests/offline_pwa.py
      - name: Run pitch worker tests
        run: python tests/ac_worker.py
      - name: Run scheduler grid pin (swing parity)
        run: python tests/swing_grid.py
      - name: Run gesture-hint a11y tests
        run: python tests/sr_hints.py
      - name: Run transport scheduler contract tests
        run: python tests/transport_schedule.py
      - name: Run audio spike-watch tests
        run: python tests/spike_watch.py
      - name: Run audio context lifecycle tests
        run: python tests/audio_state.py
      - name: Run practice history tests
        run: python tests/practice_history.py
      - name: Run template safety tests
        run: python tests/svg_sanitized.py
      - name: Run theme toggle tests
        run: python tests/theme_toggle.py
      - name: Run transposer skill script tests
        run: python tests/transpose_skill.py
      - name: Run wake-lock lifecycle tests
        run: python tests/wake_lock.py
      - name: Run practice close/mic layout tests
        run: python tests/practice_close.py
      - name: Run song-stub page generator contract tests
        run: python tests/gen_pages.py
