<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<div id="OUT">PENDING</div><div id="ERR2"></div>
<script>
try {
function installFingerings(f) {
  window.FING = f;
  window.NOTES = f.notes.map(n => n.id);
  window.DISPLAY = Object.fromEntries(f.notes.map(n => [n.id, n.display]));
  window.CHAMBER = Object.fromEntries(f.notes.map(n => [n.id, n.chamber]));
  window.COVER = Object.fromEntries(f.notes.map(n => [n.id, n.covered]));
}
installFingerings(FING_DATA);
const CFG2 = { note: "C5", dur: 1.54, noVib: false, muteAirEdge: true, masterLevel: null };
if (CFG2.noVib && window.OCA_DEBUG) { OCA_DEBUG.params.vibDepth = 0; OCA_DEBUG.params.tremDepth = 0; }
if (CFG2.masterLevel && window.OCA_DEBUG) OCA_DEBUG.params.masterLevel = CFG2.masterLevel;
// dry output chain without compressor (offline hang workaround; limiter rarely engages)
getReverbBus = function (ctx) {
  if (window.__b2 && window.__b2.context === ctx) return window.__b2;
  const input = ctx.createGain();
  const outGain = ctx.createGain(); outGain.gain.value = 0.6;
  input.connect(outGain); outGain.connect(ctx.destination);
  window.__busOut = outGain;
  window.__b2 = input;
  return input;
};
const proto = (window.AudioContext || window.webkitAudioContext).prototype;
window.AudioContext = function () {
  const o = new (window.AudioContext || window.webkitAudioContext)();
  try { o.resume && o.resume(); } catch (e) {}
  let count = 0;
  o.createOscillator = function () {
    count++;
    if (CFG2.muteAirEdge && (count === 2 || count === 4 || count === 5)) {
      const ap = { value: 440, setValueAtTime: function(){}, linearRampToValueAtTime: function(){},
                   exponentialRampToValueAtTime: function(){}, cancelScheduledValues: function(){} };
      return { type: "sine", frequency: ap, detune: { value: 0 }, setPeriodicWave: function(){},
               connect: function(){}, start: function(){}, stop: function(){} };
    }
    return proto.createOscillator.call(o);
  };
  // ScriptProcessor tap: 4096-sample blocks
  const captured = [];
  const SP = proto.createScriptProcessor ? function (bs) { return proto.createScriptProcessor.call(o, bs, 1, 1); }
                                          : null;
  if (SP) {
    const tap = SP(4096);
    tap.onaudioprocess = function (e) { captured.push(new Float32Array(e.inputBuffer.getChannelData(0))); if (captured.length > 200) tap.onaudioprocess = null; };
    tap.connect(o.destination);
    window.__tap = tap;
  }
  window.__capped = captured;
  return o;
};
function b64(buf8) {
  let s = ""; const CH = 0x8000;
  for (let i = 0; i < buf8.length; i += CH) s += String.fromCharCode.apply(null, buf8.subarray(i, i + CH));
  return btoa(s);
}
function encodeWav(f32, sr) {
  const n = f32.length;
  const buf = new ArrayBuffer(44 + n * 2), dv = new DataView(buf);
  const ws = (off, str) => { for (let i = 0; i < str.length; i++) dv.setUint8(off + i, str.charCodeAt(i)); };
  ws(0, "RIFF"); dv.setUint32(4, 36 + n * 2, true); ws(8, "WAVE"); ws(12, "fmt ");
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  ws(36, "data"); dv.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const v = Math.max(-1, Math.min(1, f32[i]));
    dv.setInt16(44 + i * 2, v < 0 ? v * 0x8000 : v * 0x7FFF, true);
  }
  return new Uint8Array(buf);
}
const needBlocks = Math.ceil(44100 * (CFG2.dur + 0.5) / 4096) + 2;
playNoteAt(CFG2.note, null, CFG2.dur, []);
const bail = setTimeout(function () {
  if (document.getElementById("OUT").textContent === "PENDING") {
    document.getElementById("OUT").textContent = "TIMEOUT blocks=" + window.__capped.length;
  }
}, 25000);
(function wait() {
  if (window.__capped.length >= needBlocks) {
    clearTimeout(bail);
    const flat = new Float32Array(needBlocks * 4096);
    flat.set(window.__capped[0].subarray(0, 4096), 0);
    for (let i = 1; i < needBlocks; i++) flat.set(window.__capped[i].subarray(0, 4096), i * 4096);
    document.getElementById("OUT").textContent = "B64:" + b64(encodeWav(flat, 44100));
  } else {
    setTimeout(wait, 80);
  }
})();
} catch (e) {
  document.getElementById("OUT").textContent = "ERR:" + e + "|" + (e && e.stack);
}
</script></body></html>
